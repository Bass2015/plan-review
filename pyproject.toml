[project]
name = "plan-review"
version = "0.1.0"
description = "Review Claude Code plans as an HTML page with task cards and comment threads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plan_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
